name: DevFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run App
      run: python app/main.py

    - name: Validate Artifact
      run: bash scripts/validate_artifact.sh

    - name: Bump Version
      run: python scripts/versioning.py

    - name: Build Docker Image
      run: docker build -t devflow:latest docker/
