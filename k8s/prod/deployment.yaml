apiVersion: apps/v1
kind: Deployment
metadata:
  name: devflow-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devflow
  template:
    metadata:
      labels:
        app: devflow
    spec:
      containers:
      - name: devflow
        image: <dockerhub-username>/devflow:latest
        imagePullPolicy: Always
